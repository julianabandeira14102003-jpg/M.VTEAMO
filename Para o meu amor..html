<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feliz Aniversário Meu Amor ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        :root {
            --pink-glow: #ff69b4;
            --pink-light: #ffb6c1;
            --purple-deep: #120318;
            --purple-dark: #08010c;
            --gold-accent: #ffd700;
            --red-glow: #ff1a40;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030105;
            font-family: 'Quicksand', 'Segoe UI', sans-serif;
            touch-action: none;
        }

        #galaxy-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: pointer;
        }

        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 15px;
            pointer-events: none;
        }

        header {
            text-align: center;
            pointer-events: auto;
            background: rgba(22, 6, 26, 0.75);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 16px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255, 105, 180, 0.45);
            box-shadow: 0 0 35px rgba(255, 20, 147, 0.4), inset 0 0 15px rgba(255, 182, 193, 0.2);
            max-width: 92%;
            transition: all 0.3s ease;
        }

        h1 {
            color: #ffc2d1;
            font-family: 'Cinzel', serif;
            font-size: clamp(1.2rem, 4.2vw, 1.75rem);
            margin-bottom: 6px;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.9), 0 0 25px rgba(255, 20, 147, 0.6);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #f8bbd0;
            font-family: 'Quicksand', sans-serif;
            font-size: clamp(0.78rem, 2.8vw, 0.95rem);
            line-height: 1.45;
            letter-spacing: 0.3px;
            opacity: 0.95;
            max-width: 600px;
            margin: 0 auto;
        }

        .controls-bar {
            display: flex;
            gap: 12px;
            align-items: center;
            pointer-events: auto;
            margin-top: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .icon-btn {
            background: rgba(35, 10, 40, 0.75);
            border: 1px solid rgba(255, 105, 180, 0.55);
            color: #ffe4e1;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.82rem;
            cursor: pointer;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.25);
        }

        .icon-btn:hover, .icon-btn:active {
            transform: translateY(-2px) scale(1.05);
            border-color: #ff69b4;
            box-shadow: 0 0 25px rgba(255, 105, 180, 0.65);
            background: rgba(60, 15, 65, 0.9);
        }

        .footer-hint {
            pointer-events: auto;
            background: rgba(22, 6, 26, 0.7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 10px 22px;
            border-radius: 25px;
            border: 1px solid rgba(255, 105, 180, 0.38);
            color: #ffe4e1;
            font-size: 0.82rem;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.3);
            animation: pulseHint 2.5s infinite ease-in-out;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        @keyframes pulseHint {
            0%, 100% { opacity: 0.8; transform: scale(1); box-shadow: 0 0 20px rgba(255, 105, 180, 0.3); }
            50% { opacity: 1; transform: scale(1.03); box-shadow: 0 0 32px rgba(255, 105, 180, 0.6); }
        }

        .poetry-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            background: rgba(18, 4, 22, 0.94);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1.5px solid rgba(255, 105, 180, 0.65);
            padding: 30px 24px 26px;
            border-radius: 28px;
            box-shadow: 0 0 65px rgba(255, 20, 147, 0.65), inset 0 0 20px rgba(255, 105, 180, 0.25);
            width: 90%;
            max-width: 480px;
            text-align: center;
            pointer-events: auto;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }

        .poetry-modal.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .modal-decor {
            font-size: 1.6rem;
            margin-bottom: 8px;
            animation: floatHeart 2s infinite ease-in-out;
        }

        @keyframes floatHeart {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .poetry-verse {
            color: #fce4ec;
            font-size: 1.02rem;
            line-height: 1.7;
            font-style: italic;
            margin-bottom: 18px;
            max-height: 280px;
            overflow-y: auto;
            padding: 0 10px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.25);
            white-space: pre-line;
        }

        .poetry-verse::-webkit-scrollbar {
            width: 4px;
        }
        .poetry-verse::-webkit-scrollbar-thumb {
            background: rgba(255, 105, 180, 0.5);
            border-radius: 4px;
        }

        .poetry-author {
            color: #ffd1dc;
            font-family: 'Great Vibes', cursive;
            font-size: 1.45rem;
            margin-bottom: 22px;
            letter-spacing: 1px;
        }

        .close-btn {
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 50%, #ff80ab 100%);
            border: none;
            color: white;
            padding: 12px 28px;
            font-size: 0.95rem;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 22px rgba(255, 20, 147, 0.7);
            transition: all 0.25s ease;
            outline: none;
        }

        .close-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.9);
        }

        .close-btn:active {
            transform: scale(0.96);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 1, 10, 0.65);
            backdrop-filter: blur(5px);
            z-index: 90;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>
    <canvas id="galaxy-canvas"></canvas>

    <div class="ui-container">
        <header>
            <h1>FELIZ ANIVERSÁRIO MEU AMOR ❤️</h1>
            <div class="subtitle">Em um universo de bilhões de estrelas, eu encontrei você, a mais brilhante e linda de todas. Te amo.</div>
            
            <div class="controls-bar">
                <button class="icon-btn" id="audioToggle" onclick="toggleAudio()">
                    <span id="audioIcon">🎵</span> <span id="audioText">Tocar "Stand By Me"</span>
                </button>
                <button class="icon-btn" onclick="recenterGalaxy()">
                    <span>✨</span> Reorganizar Galáxia (300 Estrelas)
                </button>
            </div>
        </header>

        <div class="footer-hint">
            <span>✨</span> Toque nas 300 estrelas! Encontre a Grande Estrela Dourada 👑 e a Estrela Vermelha Eternidade 🌹
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="fecharModal()"></div>

    <div class="poetry-modal" id="poetryModal">
        <div class="modal-decor" id="modalDecor">✨🌸💖🌸✨</div>
        <div class="poetry-verse" id="modalVerse">"Verso de amor..."</div>
        <div class="poetry-author" id="modalAuthor">— Fonte</div>
        <button class="close-btn" onclick="fecharModal()">Guardar no Coração ❤️</button>
    </div>

    <script>
        const canvas = document.getElementById('galaxy-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let galaxyParticles = [];
        let interactiveStars = [];
        let heartTrail = [];
        let shootingStars = [];
        let fireflies = [];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 1. Estrela Especial Dourada de Aniversário
        const textoAniversarioEspecial = {
            texto: "Minha vida, meu amor, meu lugar seguro no mundo...\n\nHoje é o dia em que o universo celebra a existência da mulher mais espetacular que já caminhou sobre esta terra: você, Maria Valesca. Olhando para o brilho de cada uma dessas estrelas, eu só consigo pensar em como eu sou abençoada e eternamente grata por você ter me deixado entrar na sua vida.\n\nEu sou a mulher mais feliz, realizada e completa do mundo inteiro simplesmente por ter o privilégio de amar você e ser amada por você. O seu sorriso é a razão pela qual meu coração bate acelerado, seu abraço é o único refúgio onde meu caos se acalma, e a sua voz é a melodia mais doce que meus ouvidos já escutaram.\n\nObrigada por me permitir fazer parte da sua história, por abrir a porta do seu coração e me dar a honra indescritível de caminhar ao seu lado. Você é perfeita em cada detalhe, em cada gesto, em cada olhar. Eu te amo com todas as forças da minha alma, hoje, em todo o seu aniversário, e em toda a eternidade que nos espera. Feliz aniversário, minha estrela guia, meu amor eterno!",
            autor: "Da mulher mais feliz do mundo, com todo meu amor",
            decor: "👑🎂💖✨🎂👑",
            color: "#ffd700"
        };

        // 2. Estrela Especial Vermelha Eternidade
        const textoEstrelaVermelha = {
            texto: "e quando meu caixão for baixado na terra e as vozes ao meu redor remerem de despedidas espequero que o ceu se lembre de como eu te amei profundamente, por que mesmo quando eu não tiver mais aqui para dizer sue nomne, cada pedaço de amor que deixei para trás ainda levará de alguma forma de volta a você",
            autor: "Meu Amor Eterno e Absoluto",
            decor: "🌹🕯️❤️🕯️🌹",
            color: "#ff1a40"
        };

        // Base de poemas, mpb e declarações sem rótulos
        const acervoPoetico300 = [
            { t: "“Te amo como se ama certas coisas obscuras, secretas, entre a sombra e a alma. Te amo sem saber como, nem quando, nem onde, te amo diretamente sem problemas nem orgulho.”", a: "Pablo Neruda" },
            { t: "“Luz dos olhos meus, a luz que me traz a paz é a luz dos olhos teus. Quando você me acena, meu coração dispara e a vida fica leve e bela como rara.”", a: "Caetano Veloso" },
            { t: "“Você é luz, raio, estrela e luar, manhã de sol, meu ioiô, meu iaiá. O anjo terno que me faz sonhar e me ensina o verdadeiro dom de amar.”", a: "Djavan" },
            { t: "“Ah, se tu soubesses quanto eu gosto da tua suave beleza, o teu olhar é uma promessa de carinho, a flor mais linda que nasceu no meu caminho.”", a: "Tom Jobim & Vinícius de Moraes" },
            { t: "“E te amo cada vez mais, mesmo quando o mundo silencia, teu nome é meu canto predileto, a melodia mais pura da minha alegria.”", a: "Chico Buarque" },
            { t: "“Você é assim, um sonho pra mim, e quando eu te vejo, o mundo para de girar. Não há palavras no dicionário que expressem o quanto é bom te amar.”", a: "Tim Maia" },
            { t: "“Duvida da luz das estrelas, duvida que o sol se mova, duvida até da verdade, mas nunca duvides do meu amor.”", a: "William Shakespeare" },
            { t: "“Se tu me amas, ama-me por amor tão somente, para que seja para sempre o nosso enlace, eterno e sem fim.”", a: "Elizabeth Barrett Browning" },
            { t: "“Amor é fogo que arde sem se ver; é ferida que dói, e não se sente; é um contentamento discontentado; é dor que desatina sem doer.”", a: "Luís de Camões" },
            { t: "“Amo-te tanto, meu amor... não me cumpre saber se é virtude ou pecado amar-te assim. Amo-te com o amor de todas as minhas vidas.”", a: "Florbela Espanca" },
            { t: "“Como é grande o meu amor por você. Nem mesmo o céu, nem as estrelas, nem o infinito do universo é maior do que o que sinto por ti.”", a: "Roberto Carlos" },
            { t: "“O meu coração pertence a você. De todas as pessoas do mundo, a minha alma escolheu você para amar pela eternidade.”", a: "Para Maria Valesca" },
            { t: "“Se eu tivesse que escolher entre respirar e te amar, eu usaria meu último fôlego para dizer: eu te amo, Maria Valesca.”", a: "Devoção Suprema" },
            { t: "“Há pessoas que iluminam a sala quando entram, mas você ilumina minha alma inteira quando sorri.”", a: "Minha Estrela Guia" },
            { t: "“A vida é bonita, mas se torna infinitamente mais bela quando dividida com você. Você é a minha paz e minha morada.”", a: "Doce Amor" },
            { t: "“Teus olhos são dois faróis no meu oceano particular. Quando estou perdida, basta olhar para você para encontrar o caminho de casa.”", a: "Amor Infinito" },
            { t: "“Eu quero estar ao seu lado em cada amanhecer, segurar sua mão nos dias difíceis e sorrir com você nos dias de festa. Você é meu tudo.”", a: "Para Sempre Sua" },
            { t: "“Sabe quando você deseja que um momento dure para sempre? É exatamente isso que sinto toda vez que estou nos seus braços.”", a: "Para Maria Valesca" },
            { t: "“O amor não se vê com os olhos, mas com o coração. E o meu coração enxerga em você a razão de toda a minha felicidade.”", a: "Poesia do Coração" },
            { t: "“Cada detalhe seu é um verso perfeito de um poema que o universo levou eras para compor.”", a: "Para o Meu Grande Amor" }
        ];

        const frasesRomanticas = [
            "Maria Valesca, sua doçura reescreveu o significado do amor na minha vida.",
            "Estar com você faz o tempo parar e o mundo ao redor desaparecer em pura magia.",
            "Você é o meu porto seguro, o meu abraço favorito e a minha oração atendida.",
            "Se cada pensamento meu sobre você virasse uma estrela, o céu nunca mais teria noites escuras.",
            "O universo é imenso, mas nenhum canto dele guarda uma beleza tão radiante quanto a sua.",
            "Segurar sua mão é ter a certeza de que estou exatamente onde eu deveria estar.",
            "Seu olhar tem o poder de acalmar qualquer tempestade na minha alma.",
            "Te amar é tão natural quanto respirar e tão vital quanto o bater do meu coração.",
            "Você é a mulher mais incrível, carinhosa, perfeita e apaixonante que já conheci.",
            "O som da sua voz é o meu refúgio e o seu sorriso é o meu lugar favorito no mundo.",
            "Nada no mundo se compara à alegria indescritível de caminhar e crescer ao seu lado.",
            "Com você aprendi que o amor verdadeiro não tem pressa, não tem limites e dura para sempre.",
            "Agradeço a cada segundo pela sorte e pela dádiva de ser a sua parceira de vida.",
            "Sua existência faz a vida ter mais cor, mais poesia, mais luz e muito mais sentido.",
            "O meu amor por você não cabe em palavras, nem em poemas, nem neste universo inteiro."
        ];

        const autoresNomes = [
            "Pablo Neruda", "Vinícius de Moraes", "Florbela Espanca", "Lord Byron",
            "Victor Hugo", "Machado de Assis", "Mário Quintana", "Guimarães Rosa",
            "Fernando Pessoa", "Castro Alves", "Cecília Meireles", "Carlos Drummond de Andrade"
        ];

        let banco300Estrelas = [];

        function gerar300Estrelas() {
            banco300Estrelas = [];
            acervoPoetico300.forEach(v => banco300Estrelas.push(v));

            let count = 0;
            while (banco300Estrelas.length < 298) {
                let f = frasesRomanticas[count % frasesRomanticas.length];
                let a = autoresNomes[count % autoresNomes.length];
                banco300Estrelas.push({
                    t: `“${f} Te amar é a jornada mais linda de toda a minha existência.”`,
                    a: `${a} & Meu Amor por Maria Valesca`
                });
                count++;
            }
        }
        gerar300Estrelas();

        class HeartParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 12 + 8;
                this.speedX = (Math.random() - 0.5) * 2;
                this.speedY = (Math.random() - 0.5) * 2 - 1.5;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = '#ff69b4';
                ctx.font = `${this.size}px serif`;
                ctx.fillText('💖', this.x, this.y);
                ctx.restore();
            }
        }

        class GalaxyParticle {
            constructor() {
                this.reset();
            }
            reset() {
                this.angle = Math.random() * Math.PI * 2;
                this.distance = Math.random() * (Math.min(width, height) * 0.45) + 20;
                this.speed = (Math.random() * 0.0015 + 0.0005) * (Math.random() < 0.5 ? 1 : -1);
                this.size = Math.random() * 1.8 + 0.5;
                this.alpha = Math.random() * 0.6 + 0.2;
                this.color = Math.random() > 0.4 ? '#ff69b4' : '#ffd700';
            }
            update() {
                this.angle += this.speed;
            }
            draw() {
                let x = width / 2 + Math.cos(this.angle) * this.distance;
                let y = height / 2 + Math.sin(this.angle) * this.distance;
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Firefly {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.speedY = (Math.random() - 0.5) * 0.8;
                this.alpha = Math.random();
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > width) this.speedX *= -1;
                if (this.y < 0 || this.y > height) this.speedY *= -1;
                this.alpha += (Math.random() - 0.5) * 0.05;
                this.alpha = Math.max(0.1, Math.min(1, this.alpha));
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = '#ffb6c1';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff69b4';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class ShootingStar {
            constructor() {
                this.spawn();
            }
            spawn() {
                this.x = Math.random() * width;
                this.y = Math.random() * (height * 0.5);
                this.len = Math.random() * 80 + 50;
                this.speed = Math.random() * 8 + 6;
                this.size = Math.random() * 1.5 + 1;
                this.active = true;
                this.alpha = 1;
            }
            update() {
                if (!this.active) return;
                this.x += this.speed;
                this.y += this.speed * 0.6;
                this.alpha -= 0.02;
                if (this.alpha <= 0 || this.x > width || this.y > height) {
                    this.active = false;
                }
            }
            draw() {
                if (!this.active) return;
                ctx.save();
                ctx.globalAlpha = this.alpha;
                let grad = ctx.createLinearGradient(this.x, this.y, this.x - this.len, this.y - this.len * 0.6);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.5, '#ff69b4');
                grad.addColorStop(1, 'transparent');
                ctx.strokeStyle = grad;
                ctx.lineWidth = this.size;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - this.len, this.y - this.len * 0.6);
                ctx.stroke();
                ctx.restore();
            }
        }

        class InteractiveStar {
            constructor(dadosAmor, tipo = 'normal') {
                this.dadosAmor = dadosAmor;
                this.tipo = tipo; // 'birthday', 'red', 'normal'
                this.hitRadius = tipo === 'birthday' ? 40 : (tipo === 'red' ? 32 : 24);
                this.resetPosition();
            }
            resetPosition() {
                if (this.tipo === 'birthday') {
                    this.x = width / 2;
                    this.y = height / 2;
                    this.size = 7.5;
                    this.color = '#ffd700';
                } else if (this.tipo === 'red') {
                    this.x = width / 2 + (Math.random() < 0.5 ? -1 : 1) * (Math.random() * 100 + 80);
                    this.y = height / 2 + (Math.random() < 0.5 ? -1 : 1) * (Math.random() * 100 + 80);
                    this.size = 5.5;
                    this.color = '#ff1a40';
                } else {
                    this.x = Math.random() * (width - 40) + 20;
                    this.y = Math.random() * (height - 40) + 20;
                    this.size = Math.random() * 2.2 + 1.8;
                    this.color = Math.random() > 0.3 ? '#ff69b4' : '#ffb6c1';
                }
                this.pulseSpeed = Math.random() * 0.04 + 0.01;
                this.pulse = Math.random() * Math.PI;
            }
            update() {
                this.pulse += this.pulseSpeed;
            }
            draw() {
                ctx.save();
                let scale = 1 + Math.sin(this.pulse) * 0.25;
                let currentSize = this.size * scale;

                ctx.shadowBlur = this.tipo === 'birthday' ? 25 : (this.tipo === 'red' ? 20 : 12);
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;

                ctx.beginPath();
                ctx.arc(this.x, this.y, currentSize, 0, Math.PI * 2);
                ctx.fill();

                if (this.tipo === 'birthday' || this.tipo === 'red' || currentSize > 2.5) {
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(this.x - currentSize * 2.5, this.y);
                    ctx.lineTo(this.x + currentSize * 2.5, this.y);
                    ctx.moveTo(this.x, this.y - currentSize * 2.5);
                    ctx.lineTo(this.x, this.y + currentSize * 2.5);
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        function initGalaxy() {
            galaxyParticles = [];
            for (let i = 0; i < 550; i++) {
                galaxyParticles.push(new GalaxyParticle());
            }

            fireflies = [];
            for (let i = 0; i < 35; i++) {
                fireflies.push(new Firefly());
            }

            shootingStars = [new ShootingStar(), new ShootingStar(), new ShootingStar()];

            interactiveStars = [];

            // 1. Estrela Dourada Grande Especial de Aniversário
            interactiveStars.push(new InteractiveStar(textoAniversarioEspecial, 'birthday'));

            // 2. Estrela Vermelha Especial
            interactiveStars.push(new InteractiveStar(textoEstrelaVermelha, 'red'));

            // 3. Exatamente 298 estrelas adicionais = 300 Estrelas Interativas no Total
            banco300Estrelas.forEach(item => {
                interactiveStars.push(new InteractiveStar({
                    texto: item.t,
                    autor: item.a,
                    decor: "✨💖✨",
                    color: "#ff69b4"
                }));
            });
        }

        function recenterGalaxy() {
            initGalaxy();
        }

        function createHeartTrail(x, y) {
            for (let i = 0; i < 2; i++) {
                heartTrail.push(new HeartParticle(x, y));
            }
        }

        let isPointerDown = false;

        window.addEventListener('pointerdown', (e) => {
            isPointerDown = true;
            handleStarClick(e.clientX, e.clientY);
            createHeartTrail(e.clientX, e.clientY);
        });

        window.addEventListener('pointermove', (e) => {
            if (isPointerDown || Math.random() < 0.25) {
                createHeartTrail(e.clientX, e.clientY);
            }
        });

        window.addEventListener('pointerup', () => { isPointerDown = false; });

        function handleStarClick(x, y) {
            for (let star of interactiveStars) {
                let dist = Math.hypot(star.x - x, star.y - y);
                if (dist < star.hitRadius) {
                    mostrarPoesia(star.dadosAmor);
                    break;
                }
            }
        }

        function mostrarPoesia(dados) {
            document.getElementById('modalVerse').innerText = dados.texto;
            document.getElementById('modalAuthor').innerText = "— " + dados.autor;
            document.getElementById('modalDecor').innerText = dados.decor || "✨🌸💖🌸✨";
            
            const modal = document.getElementById('poetryModal');
            if (dados.color) {
                modal.style.borderColor = dados.color;
                modal.style.boxShadow = `0 0 65px ${dados.color}, inset 0 0 20px ${dados.color}`;
            } else {
                modal.style.borderColor = 'rgba(255, 105, 180, 0.65)';
                modal.style.boxShadow = '0 0 65px rgba(255, 20, 147, 0.65)';
            }

            modal.classList.add('active');
            document.getElementById('overlay').classList.add('active');
        }

        function fecharModal() {
            document.getElementById('poetryModal').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }

        let audioCtx = null;
        let isAudioPlaying = false;
        let musicTimer = null;

        const standByMeNotes = [
            { note: 220.00, dur: 0.6 },
            { note: 220.00, dur: 0.4 },
            { note: 246.94, dur: 0.4 },
            { note: 277.18, dur: 0.6 },
            { note: 220.00, dur: 0.8 },
            
            { note: 185.00, dur: 0.6 },
            { note: 185.00, dur: 0.4 },
            { note: 220.00, dur: 0.4 },
            { note: 185.00, dur: 0.8 },

            { note: 146.83, dur: 0.6 },
            { note: 164.81, dur: 0.6 },
            { note: 220.00, dur: 0.8 },
            
            { note: 440.00, dur: 0.5 },
            { note: 440.00, dur: 0.5 },
            { note: 415.30, dur: 0.5 },
            { note: 369.99, dur: 0.5 },
            { note: 329.63, dur: 0.8 },
            { note: 293.66, dur: 0.6 },
            { note: 329.63, dur: 0.6 },
            { note: 440.00, dur: 1.2 }
        ];

        let currentNoteIdx = 0;

        function playNextNote() {
            if (!isAudioPlaying || !audioCtx) return;

            const item = standByMeNotes[currentNoteIdx];
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(item.note, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + item.dur - 0.05);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + item.dur);

            currentNoteIdx = (currentNoteIdx + 1) % standByMeNotes.length;
            musicTimer = setTimeout(playNextNote, item.dur * 850);
        }

        function toggleAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (isAudioPlaying) {
                isAudioPlaying = false;
                clearTimeout(musicTimer);
                document.getElementById('audioIcon').innerText = '🎵';
                document.getElementById('audioText').innerText = 'Tocar "Stand By Me"';
            } else {
                isAudioPlaying = true;
                playNextNote();
                document.getElementById('audioIcon').innerText = '🎶';
                document.getElementById('audioText').innerText = 'Pausar Música';
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 1, 10, 0.28)';
            ctx.fillRect(0, 0, width, height);

            galaxyParticles.forEach(p => {
                p.update();
                p.draw();
            });

            fireflies.forEach(f => {
                f.update();
                f.draw();
            });

            if (Math.random() < 0.015) {
                let inactiveStar = shootingStars.find(s => !s.active);
                if (inactiveStar) inactiveStar.spawn();
            }

            shootingStars.forEach(s => {
                s.update();
                s.draw();
            });

            for (let i = heartTrail.length - 1; i >= 0; i--) {
                heartTrail[i].update();
                heartTrail[i].draw();
                if (heartTrail[i].alpha <= 0) {
                    heartTrail.splice(i, 1);
                }
            }

            interactiveStars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animate);
        }

        window.onload = function () {
            initGalaxy();
            animate();
        };
    </script>
</body>
</html>
